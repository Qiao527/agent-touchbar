name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Core tests & lint (Linux)
    # Core logic is AppKit-free, so it is tested on Linux: fast and cheap.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: Install smoke-test runtime
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Verify core and CLI
        run: ./scripts/check.sh

  macos:
    name: Build app (macOS)
    timeout-minutes: 30
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Verify core and CLI
        run: ./scripts/check.sh
      - name: Build and package app
        run: ./scripts/build-app.sh
      - name: Build probe
        run: swiftc -O probe/main.swift -o build/ATBProbe
      - name: Smoke-test packaged CLI
        run: python3 scripts/smoke-test.py build/agentTouchbar.app/Contents/MacOS/atb
      - name: Zip
        run: cd build && ditto -c -k --keepParent agentTouchbar.app agentTouchbar.zip
      - uses: actions/upload-artifact@v7
        with:
          name: agentTouchbar
          path: build/agentTouchbar.zip
