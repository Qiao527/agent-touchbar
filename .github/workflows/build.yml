name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Core tests & lint (Linux)
    # Core logic is AppKit-free, so it is tested on Linux: fast and cheap.
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests probe Package.swift
      - name: Test
        run: swift test

  macos:
    name: Build app (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build and package app
        run: ./scripts/build-app.sh
      - name: Build probe
        run: swiftc -O probe/main.swift -o build/ATBProbe
      - name: Smoke-test atb
        run: |
          ATB=build/agentTouchbar.app/Contents/MacOS/atb
          $ATB --help
          $ATB hooks claude | tail -n +2 | python3 -m json.tool > /dev/null
          # Hooks must exit 0 even when the app is not running.
          echo '{"hook_event_name":"Stop","session_id":"ci"}' | $ATB hook claude
          echo '{"hook_event_name":"PermissionRequest","session_id":"ci","tool_name":"Bash"}' | $ATB hook claude
      - name: Zip
        run: cd build && ditto -c -k --keepParent agentTouchbar.app agentTouchbar.zip
      - uses: actions/upload-artifact@v7
        with:
          name: agentTouchbar
          path: build/agentTouchbar.zip
